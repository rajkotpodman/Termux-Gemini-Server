<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Termux Gemini Server</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var l = window.location;
      // Redirect to root with query string if accessing subpath
      window.location.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/'
      );
    </script>
  </head>
  <body>
  </body>
</html>
